name: Docker-Dev

on:
  push:
    branches:
      - dev*
      - ghcr
    paths:
      - "cmd/**"
      - "server/**"
      - "shared/**"
      - "go.mod"
      - "go.sum"
      - "docker/**"
      - ".github/workflows/docker-dev.yml"

env:
  GHCR_SLUG: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            tag: dev-amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            tag: dev-arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      package_name: ${{ steps.get_package_name.outputs.package_name }}
      # Per-arch tag prefix and final manifest tag, decided by the trigger branch:
      #   dev*  -> tag prefix "dev",  final tag "dev"
      #   ghcr  -> tag prefix "ghcr", final tag "latest"
      tag_prefix: ${{ steps.set_tags.outputs.tag_prefix }}
      final_tag: ${{ steps.set_tags.outputs.final_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set package name
        id: get_package_name
        run: |
          PACKAGE_NAME="$(basename ${{ github.repository }})"
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT

      - name: Set tags by branch
        id: set_tags
        run: |
          if [[ "${{ github.ref_name }}" == ghcr ]]; then
            TAG_PREFIX=ghcr
            FINAL_TAG=latest
          else
            TAG_PREFIX=dev
            FINAL_TAG=dev
          fi
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "final_tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=$TAG_PREFIX" >> "$GITHUB_ENV"
          echo "final_tag=$FINAL_TAG" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # make build-server depends on build-ui, which needs pnpm. The pnpm
      # version is pinned by the packageManager field in web/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compile the server binary for the target arch and place it where the
      # rootless Dockerfile expects it (mirrors atomgit/build.sh).
      - name: Build server binary
        env:
          TARGETOS: linux
          TARGETARCH: ${{ matrix.arch }}
        run: |
          make build-server
          mkdir -p "dist/server/${TARGETOS}_${TARGETARCH}"
          cp -f "dist/woodpecker-server" "dist/server/${TARGETOS}_${TARGETARCH}/woodpecker-server"

      # Build the rootless multiarch server image (same Dockerfile/args as
      # atomgit/build.sh) and push the per-arch tag to GHCR.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.server.multiarch.rootless
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            TARGETOS=linux
            TARGETARCH=${{ matrix.arch }}
          tags: ${{ env.GHCR_SLUG }}:${{ steps.set_tags.outputs.tag_prefix }}-${{ matrix.arch }}
          provenance: false
          sbom: false

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Combine the per-arch images into a single multi-arch manifest.
      # buildx imagetools create handles both single images and manifest lists
      # (docker/build-push-action pushes each arch as a manifest list), unlike
      # docker manifest create which rejects amending a manifest list.
      # The manifest tag is "dev" for dev* branches and "latest" for ghcr.
      - name: Create and push multi-arch manifest
        env:
          TAG_PREFIX: ${{ needs.build.outputs.tag_prefix }}
          FINAL_TAG: ${{ needs.build.outputs.final_tag }}
        run: |
          docker buildx imagetools create --tag "${{ env.GHCR_SLUG }}:${FINAL_TAG}" \
            "${{ env.GHCR_SLUG }}:${TAG_PREFIX}-amd64" \
            "${{ env.GHCR_SLUG }}:${TAG_PREFIX}-arm64"
        shell: bash

      - name: Delete old package versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package-name: ${{ needs.build.outputs.package_name }}
          delete-untagged: true
          keep-n-tagged: 5
